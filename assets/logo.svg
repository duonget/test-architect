<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="100%" stop-color="#0f111a" />
    </linearGradient>
  </defs>

  <!-- Container Icon Background -->
  <rect width="120" height="120" rx="26" fill="url(#bgGrad)" stroke="#2b3145" stroke-width="1.5" />

  <!-- Architectural Shield Outline -->
  <path d="M 60,18 L 94,32 L 94,68 C 94,92 60,105 60,105 C 60,105 26,92 26,68 L 26,32 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Inner Blueprint Matrix Grid -->
  <path d="M 40,40 L 80,40 M 40,55 L 80,55 M 40,70 L 80,70" 
        stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2,2" />
  <path d="M 50,30 L 50,85 M 70,30 L 70,85" 
        stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2,2" />

  <!-- Stylized "A" (Architect) with Circuit Nodes -->
  <path d="M 60,32 L 44,78 M 60,32 L 76,78 M 48,63 L 72,63" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Circuit Nodes -->
  <circle cx="60" cy="32" r="3.5" fill="#38bdf8" />
  <circle cx="48" cy="63" r="2.5" fill="#34d399" />
  <circle cx="72" cy="63" r="2.5" fill="#34d399" />
  <circle cx="44" cy="78" r="3" fill="#38bdf8" />
  <circle cx="76" cy="78" r="3" fill="#38bdf8" />
</svg>
