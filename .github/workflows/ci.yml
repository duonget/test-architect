name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-skill:
    name: Verify Test Architect on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11"]
        node-version: ["20.19"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Verify Runner Detection Script
        run: ./scripts/detect-runner.sh .

      - name: Check shell and Python syntax
        run: |
          bash -n install.sh scripts/*.sh
          python3 -m py_compile scripts/mutation-check.py tests/test_dogfood.py

      - name: Run Self-Audit Dogfooding Test Suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Type-check TypeScript example
        run: npm run typecheck

      - name: Run TypeScript example suite
        run: npm test

      - name: Run Mutation Sanity Gate
        run: |
          python3 scripts/mutation-check.py \
            --target examples/payment-workflow/payment.ts \
            --validate "npm run typecheck" \
            --test "npm test" \
            --max-mutations 2 \
            --timeout 60

      - name: Verify Universal Installer
        run: |
          mkdir -p test-sandbox
          ./install.sh test-sandbox
          test -f test-sandbox/AGENTS.md
          test -f test-sandbox/.cursor/rules/test-architect.mdc
          test -f test-sandbox/.github/copilot-instructions.md
          test -f test-sandbox/CLAUDE.md
          test -x test-sandbox/.agents/skills/test-architect/scripts/detect-runner.sh
          rm -rf test-sandbox
